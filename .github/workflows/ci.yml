name: Amharic ASR CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, 3.10, 3.11]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e sdk/python/
        pip install pytest pytest-asyncio
    
    - name: Lint with flake8
      run: |
        flake8 sdk/python/ --max-line-length=100
    
    - name: Run tests
      run: |
        pytest tests/ -v
  
  build:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Build Docker image
      run: |
        docker build -f docker/Dockerfile -t amharic-asr:${{ github.sha }} .
    
    - name: Test Docker image
      run: |
        docker run -d --name test -p 8000:8000 amharic-asr:${{ github.sha }}
        sleep 10
        curl -f http://localhost:8000/health
        docker stop test
  
  push:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Push to GHCR
      run: |
        docker build -f docker/Dockerfile -t ghcr.io/${{ github.repository }}/amharic-asr:${{ github.sha }} .
        docker push ghcr.io/${{ github.repository }}/amharic-asr:${{ github.sha }}
